<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#82cde9"
    >

    <title>Para Gabi 🌻</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div id="app">

    <!-- =========================
         CÉU
    ========================== -->

    <section id="sky" aria-hidden="true">

        <div id="sun-glow"></div>
        <div id="sun"></div>

        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>

    </section>


    <!-- =========================
         INTRODUÇÃO
    ========================== -->

    <header id="intro">

        <h1>Para Gabi ☀️</h1>

        <p>
            Algumas pessoas deixam o mundo
            mais bonito apenas por existirem.
        </p>

    </header>


    <!-- =========================
         JARDIM
    ========================== -->

    <main id="garden">

        <!-- Morro distante -->

        <div
            class="hill hill-far"
            id="hill-far"
        >
            <div
                class="vegetation"
                id="vegetation-far"
            ></div>
        </div>


        <!-- Morro traseiro -->

        <div
            class="hill hill-back"
            id="hill-back"
        >
            <div
                class="vegetation"
                id="vegetation-back"
            ></div>
        </div>


        <!-- Morro central -->

        <div
            class="hill hill-middle"
            id="hill-middle"
        >
            <div
                class="vegetation"
                id="vegetation-middle"
            ></div>
        </div>


        <!-- Morro frontal -->

        <div
            class="hill hill-front"
            id="hill-front"
        >
            <div
                class="vegetation"
                id="vegetation-front"
            ></div>
        </div>


        <!-- =========================
             GIRASSOL PRINCIPAL
        ========================== -->

        <button
            id="main-flower"
            type="button"
            aria-label="Descobrir uma memória"
        >

            <img
                src="imagem/girassol.png"
                alt="Girassol"
                draggable="false"
            >

        </button>


        <!-- =========================
             JOANINHA
        ========================== -->

        <button
            id="ladybug"
            type="button"
            aria-label="Ver lembrança da joaninha"
        >

            <img
                src="imagem/joaninha.png"
                alt=""
                draggable="false"
            >

        </button>


        <!-- =========================
             DICA
        ========================== -->

        <div id="garden-hint">
            Toque no girassol 🌻
        </div>

    </main>


    <!-- =========================
         PÉTALAS
    ========================== -->

    <div
        id="petal-layer"
        aria-hidden="true"
    ></div>


    <!-- =========================
         MODAL DE MEMÓRIA
    ========================== -->

    <div
        id="memory-modal"
        class="modal"
        aria-hidden="true"
    >

        <div
            class="modal-card"
            role="dialog"
            aria-modal="true"
            aria-label="Memória"
        >

            <button
                id="memory-close"
                class="close-button"
                type="button"
                aria-label="Fechar memória"
            >
                ×
            </button>


            <div class="memory-photo">

                <img
                    id="memory-image"
                    src=""
                    alt=""
                    draggable="false"
                >

            </div>


            <p id="memory-caption"></p>

            <span id="memory-counter"></span>

        </div>

    </div>


    <!-- =========================
         MODAL DA JOANINHA
    ========================== -->

    <div
        id="ladybug-modal"
        class="modal"
        aria-hidden="true"
    >

        <div
            class="modal-card ladybug-card"
            role="dialog"
            aria-modal="true"
            aria-label="Lembrança da joaninha"
        >

            <button
                id="ladybug-close"
                class="close-button"
                type="button"
                aria-label="Fechar lembrança"
            >
                ×
            </button>


            <img
                src="imagem/joaninha-engracada.jpg"
                alt="Joaninha engraçada"
                draggable="false"
            >


            <p>
                Até a joaninha deixou uma
                lembrança por aqui. 🐞😂
            </p>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
