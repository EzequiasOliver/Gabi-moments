<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Gabi 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Música -->
    <audio id="bgMusic" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Céu -->
    <div class="sky">

        <!-- Sol -->
        <div class="sun"></div>

        <!-- Partículas -->
        <div class="light"></div>

        <!-- Nuvens -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <!-- Conteúdo -->
        <main class="content">

            <h1>Para Gabi ☀️</h1>

            <p class="subtitle">
                Algumas pessoas deixam o mundo mais bonito apenas por existirem.
            </p>

          <div id="garden">
    <img id="sunflower" src="imagem/girassol.png" alt="Girassol">
</div>

            </div>

            <p class="touch">
                Toda flor guarda uma lembrança...
            </p>

        </main>

        <!-- Grama -->
        <div class="grass"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
