<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#83cde8"
    >

    <title>Para Gabi 🌻</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div id="app">

    <!-- =====================================================
         CÉU
    ====================================================== -->

    <div id="sky">

        <div id="sun-glow"></div>

        <div id="sun"></div>

        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="cloud cloud-three"></div>

    </div>


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header id="intro">

        <h1>Para Gabi ☀️</h1>

        <p>
            Algumas pessoas deixam o mundo
            mais bonito apenas por existirem.
        </p>

    </header>


    <!-- =====================================================
         JARDIM
    ====================================================== -->

    <main id="garden">


        <!-- =================================================
             MORRO 1 — DISTANTE
        ================================================== -->

        <div
            class="hill hill-far"
            id="hill-far"
        >

            <div
                class="vegetation"
                id="vegetation-far"
            ></div>

        </div>


        <!-- =================================================
             MORRO 2 — TRASEIRO
        ================================================== -->

        <div
            class="hill hill-back"
            id="hill-back"
        >

            <div
                class="vegetation"
                id="vegetation-back"
            ></div>

        </div>


        <!-- =================================================
             MORRO 3 — CENTRAL
        ================================================== -->

        <div
            class="hill hill-middle"
            id="hill-middle"
        >

            <div
                class="vegetation"
                id="vegetation-middle"
            ></div>

            <div
                class="memory-layer"
                id="memory-middle"
            ></div>

        </div>


        <!-- =================================================
             MORRO 4 — FRENTE
        ================================================== -->

        <div
            class="hill hill-front"
            id="hill-front"
        >

            <div
                class="vegetation"
                id="vegetation-front"
            ></div>

            <div
                class="memory-layer"
                id="memory-front"
            ></div>

        </div>


        <!-- =================================================
             GIRASSOL PRINCIPAL
        ================================================== -->

        <button
            id="main-flower"
            class="main-flower"
            type="button"
            aria-label="Interagir com o girassol"
        >

            <img
                src="imagem/girassol.png"
                alt="Girassol"
                draggable="false"
            >

        </button>


        <!-- =================================================
             JOANINHA
        ================================================== -->

        <button
            id="ladybug"
            type="button"
            aria-label="Abrir a lembrança da joaninha"
        >

            <img
                src="imagem/joaninha.png"
                alt=""
                draggable="false"
            >

        </button>


        <!-- =================================================
             DICA
        ================================================== -->

        <div id="garden-hint">
            Toque nos girassóis 🌻
        </div>

    </main>


    <!-- =====================================================
         PÉTALAS
    ====================================================== -->

    <div
        id="petal-layer"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MODAL DAS MEMÓRIAS
    ====================================================== -->

    <div
        id="memory-modal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-card">

            <button
                id="memory-close"
                class="close-button"
                type="button"
                aria-label="Fechar"
            >
                ×
            </button>


            <div class="modal-image-box">

                <img
                    id="memory-image"
                    src=""
                    alt=""
                >

            </div>


            <p id="memory-caption"></p>

            <span id="memory-counter"></span>

        </div>

    </div>


    <!-- =====================================================
         MODAL DA JOANINHA
    ====================================================== -->

    <div
        id="ladybug-modal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-card ladybug-card">

            <button
                id="ladybug-close"
                class="close-button"
                type="button"
                aria-label="Fechar"
            >
                ×
            </button>


            <img
                src="imagem/joaninha-engracada.jpg"
                alt="Joaninha engraçada"
                draggable="false"
            >


            <p>
                Até a joaninha deixou uma
                lembrança por aqui. 🐞😂
            </p>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
