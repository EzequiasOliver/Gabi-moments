<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#83cfe9"
    >

    <title>Para Gabi 🌻</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

<div id="app">


    <!-- ==============================
         CÉU
    =============================== -->

    <div id="sky">

        <div id="sun-glow"></div>

        <div id="sun"></div>

        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>

    </div>



    <!-- ==============================
         CABEÇALHO
    =============================== -->

    <header id="intro">

        <h1>
            Para Gabi ☀️
        </h1>

        <p>
            Algumas pessoas deixam o mundo
            mais bonito apenas por existirem.
        </p>

    </header>



    <!-- ==============================
         JARDIM
    =============================== -->

    <main id="garden">


        <!-- ==============================
             MORRO DISTANTE
        =============================== -->

        <section
            class="hill hill-far"
            id="hillFar"
        >

            <div
                class="hill-decoration"
                id="decorFar"
            ></div>

        </section>



        <!-- ==============================
             MORRO TRASEIRO
        =============================== -->

        <section
            class="hill hill-back"
            id="hillBack"
        >

            <div
                class="hill-decoration"
                id="decorBack"
            ></div>

        </section>



        <!-- ==============================
             MORRO CENTRAL
        =============================== -->

        <section
            class="hill hill-middle"
            id="hillMiddle"
        >

            <div
                class="hill-decoration"
                id="decorMiddle"
            ></div>

        </section>



        <!-- ==============================
             MORRO DA FRENTE
        =============================== -->

        <section
            class="hill hill-front"
            id="hillFront"
        >

            <div
                class="hill-decoration"
                id="decorFront"
            ></div>

        </section>



        <!-- ==============================
             FLORES DE MEMÓRIA
        =============================== -->

        <div
            id="memoryFlowers"
            aria-label="Lembranças"
        ></div>



        <!-- ==============================
             GIRASSOL PRINCIPAL
        =============================== -->

        <button
            id="mainFlower"
            type="button"
            aria-label="Interagir com o girassol"
        >

            <img
                src="imagem/girassol.png"
                alt="Girassol"
                draggable="false"
            >

        </button>



        <!-- ==============================
             JOANINHA
        =============================== -->

        <button
            id="ladybug"
            type="button"
            aria-label="Abrir lembrança da joaninha"
        >

            <img
                src="imagem/joaninha.png"
                alt=""
                draggable="false"
            >

        </button>



        <!-- ==============================
             MENSAGEM
        =============================== -->

        <div id="gardenHint">

            Toque nos girassóis 🌻

        </div>


    </main>



    <!-- ==============================
         PÉTALAS
    =============================== -->

    <div
        id="petalLayer"
        aria-hidden="true"
    ></div>



    <!-- ==============================
         MODAL DAS MEMÓRIAS
    =============================== -->

    <div
        id="memoryModal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-card">

            <button
                id="closeMemory"
                class="close-button"
                type="button"
                aria-label="Fechar"
            >
                ×
            </button>


            <div class="modal-image-wrapper">

                <img
                    id="memoryImage"
                    src=""
                    alt=""
                >

            </div>


            <p id="memoryCaption"></p>


            <span id="memoryCounter"></span>

        </div>

    </div>



    <!-- ==============================
         MODAL DA JOANINHA
    =============================== -->

    <div
        id="ladybugModal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-card ladybug-card">

            <button
                id="closeLadybug"
                class="close-button"
                type="button"
                aria-label="Fechar"
            >
                ×
            </button>


            <img
                src="imagem/joaninha-engracada.jpg"
                alt="Joaninha engraçada"
                draggable="false"
            >


            <p>
                Até a joaninha quis deixar
                uma lembrança por aqui. 🐞😂
            </p>

        </div>

    </div>


</div>


<script src="script.js"></script>

</body>

</html>
