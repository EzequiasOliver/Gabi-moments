<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Para Gabi 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         MÚSICA
    ========================================== -->

    <audio id="bgMusic" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>


    <!-- =========================================
         BOTÃO DA MÚSICA
    ========================================== -->

    <button
        id="musicButton"
        class="music-button"
        aria-label="Ativar ou desativar música"
    >
        🔇
    </button>


    <!-- =========================================
         CÉU
    ========================================== -->

    <div id="sky">

        <!-- Sol -->
        <div id="sun"></div>

        <!-- Raios do sol -->
        <div id="sunRays"></div>


        <!-- Nuvens -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>


        <!-- Partículas luminosas -->
        <div id="lightParticles"></div>


        <!-- =====================================
             JOANINHA
        ====================================== -->

        <button
            id="ladybug"
            aria-label="Joaninha"
        >
            <img
                src="imagem/joaninha.png"
                alt="Joaninha"
            >
        </button>


        <!-- =====================================
             CONTEÚDO PRINCIPAL
        ====================================== -->

        <main id="mainContent">

            <h1>
                Para Gabi ☀️
            </h1>


            <p id="subtitle">
                Algumas pessoas deixam o mundo mais bonito apenas por existirem.
            </p>


            <!-- =================================
                 JARDIM
            ================================== -->

            <section id="garden">

                <!-- Céu/área livre -->

                <div id="gardenSky"></div>


                <!-- =================================
                     TERRENO
                ================================== -->

                <div id="terrain">

                    <div class="hill hill-far"></div>

                    <div class="hill hill-back"></div>

                    <div class="hill hill-middle"></div>

                    <div class="hill hill-front"></div>

                </div>


                <!-- =================================
                     GRAMA
                ================================== -->

                <div id="grassLayer"></div>


                <!-- =================================
                     FLORES DECORATIVAS
                ================================== -->

                <div id="flowerLayer"></div>


                <!-- =================================
                     GIRASSÓIS DAS MEMÓRIAS
                ================================== -->

                <div id="memoryFlowers"></div>


                <!-- =================================
                     GIRASSOL PRINCIPAL
                ================================== -->

                <div id="mainFlowerContainer">

                    <img
                        id="sunflower"
                        src="imagem/girassol.png"
                        alt="Girassol principal"
                    >

                </div>


                <!-- =================================
                     TEXTO
                ================================== -->

                <p id="touchMessage">
                    Toque no girassol 🌻
                </p>


                <!-- =================================
                     PÉTALAS
                ================================== -->

                <div id="petalLayer"></div>

            </section>

        </main>

    </div>


    <!-- =========================================
         MODAL DE MEMÓRIA
    ========================================== -->

    <div
        id="memoryModal"
        class="modal"
        aria-hidden="true"
    >

        <div
            id="memoryCard"
            class="memory-card"
        >

            <button
                id="closeMemory"
                class="close-button"
                aria-label="Fechar"
            >
                ×
            </button>


            <div class="memory-photo-container">

                <img
                    id="memoryImage"
                    src=""
                    alt="Lembrança"
                >

            </div>


            <p id="memoryCaption"></p>


            <div
                id="memoryCounter"
                class="memory-counter"
            >
                1 / 3
            </div>

        </div>

    </div>


    <!-- =========================================
         MODAL DA JOANINHA
    ========================================== -->

    <div
        id="ladybugModal"
        class="modal"
        aria-hidden="true"
    >

        <div
            id="ladybugCard"
            class="memory-card ladybug-card"
        >

            <button
                id="closeLadybug"
                class="close-button"
                aria-label="Fechar"
            >
                ×
            </button>


            <img
                id="ladybugImage"
                src="imagem/joaninha-engracada.jpg"
                alt="Joaninha engraçada"
            >


            <p>
                A joaninha resolveu posar para a câmera 😂🐞
            </p>

        </div>

    </div>


    <!-- =========================================
         SCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
