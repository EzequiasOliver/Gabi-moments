<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Para Gabi 🌻</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Música -->

<audio id="bgMusic" loop>

<source src="musica.mp3" type="audio/mpeg">

</audio>

<!-- Céu -->

<div class="sky">

<!-- Sol -->

<div class="sun"></div>

<!-- Luz -->

<div class="light"></div>

<!-- Nuvens -->

<div class="cloud cloud1"></div>

<div class="cloud cloud2"></div>

<div class="cloud cloud3"></div>

<!-- Joaninha -->

<div id="ladybug">

🐞

</div>

<!-- Jardim -->

<main class="content">

<h1>Para Gabi ☀️</h1>

<p class="subtitle">

Algumas pessoas deixam o mundo mais bonito apenas por existirem.

</p>

<section id="garden">

<!-- Morros -->

<div id="terrain">

<div class="hill back"></div>

<div class="hill back2"></div>

<div class="hill middle"></div>

<div class="hill front"></div>

<div class="hill front2"></div>

</div>

<!-- Grama -->

<div id="grass"></div>

<!-- Flores decorativas -->

<div id="decorations"></div>

<!-- Flores das lembranças -->

<div id="decorations"></div>

<div id="gardenField"></div>

<!-- Efeitos -->

<div id="effects"></div>

<!-- Girassol principal -->

<img

id="sunflower"

src="imagem/girassol.png"

alt="Girassol">

</section>

<p class="touch">

Toque no girassol 🌻

</p>

</main>

</div>

<!-- Modal das lembranças -->

<div id="memoryModal">

<div id="memoryCard">

<img

id="memoryImage"

src=""

alt="Foto">

<p id="memoryCaption"></p>

</div>

</div>

<!-- Modal da Joaninha -->

<div id="ladybugModal">

<div id="ladybugCard">

<img

id="ladybugImage"

src="imagem/joaninha.jpg"

alt="Joaninha">

<p>

A joaninha resolveu posar para a câmera 😂🐞

</p>

</div>

</div>

<div id="petals"></div>

<script src="script.js"></script>

</body>

</html>
