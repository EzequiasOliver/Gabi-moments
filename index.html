<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Gabi 🌻</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<audio id="bgMusic" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<div class="sky">

    <!-- Sol -->
    <div class="sun"></div>

    <!-- Luz -->
    <div class="light"></div>

    <!-- Nuvens -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <!-- Joaninha -->
    <img
        id="ladybug"
        src="imagem/joaninha.png"
        alt="Joaninha">

    <main class="content">

        <h1>Para Gabi ☀️</h1>

        <p class="subtitle">
            Algumas pessoas deixam o mundo mais bonito apenas por existirem.
        </p>

        <section id="garden">

            <!-- Morros -->
            <div id="terrain">

                <div class="hill hill1"></div>
                <div class="hill hill2"></div>
                <div class="hill hill3"></div>
                <div class="hill hill4"></div>
                <div class="hill hill5"></div>

            </div>

            <!-- Gramas -->
            <div id="grassLayer"></div>

            <!-- Flores decorativas -->
            <div id="flowerLayer"></div>

            <!-- Girassóis plantados -->
            <div id="gardenField"></div>

            <!-- Brilhos -->
            <div id="effectLayer"></div>

            <!-- Girassol principal -->
            <img
                id="sunflower"
                src="imagem/girassol.png"
                alt="Girassol">

        </section>

        <p class="touch">
            Toque no girassol 🌻
        </p>

    </main>

</div>

<!-- Modal -->

<div id="memoryModal">

    <div id="memoryCard">

        <img
            id="memoryImage"
            src=""
            alt="Foto">

        <p id="memoryCaption"></p>

    </div>

</div>

<!-- Modal Joaninha -->

<div id="ladybugModal">

    <div id="ladybugCard">

        <img
            src="imagem/joaninha-engracada.jpg"
            id="ladybugImage">

        <p>
            Até a joaninha resolveu posar para a câmera 😂🐞
        </p>

    </div>

</div>

<!-- Pétalas -->

<div id="petals"></div>

<script src="script.js"></script>

</body>

</html>
