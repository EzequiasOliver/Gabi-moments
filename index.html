<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#83cde8"
    >

    <meta
        name="description"
        content="Um pequeno jardim de lembranças para Gabi."
    >

    <title>Para Gabi 🌻</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div id="app">

    <!-- =====================================================
         CÉU
    ====================================================== -->

    <section id="sky" aria-hidden="true">

        <div id="sun-glow"></div>

        <div id="sun"></div>

        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="cloud cloud-three"></div>

    </section>


    <!-- =====================================================
         INTRODUÇÃO
    ====================================================== -->

    <header id="intro">

        <h1>Para Gabi ☀️</h1>

        <p>
            Algumas pessoas deixam o mundo
            mais bonito apenas por existirem.
        </p>

    </header>


    <!-- =====================================================
         JARDIM
    ====================================================== -->

    <main id="garden">

        <!-- =================================================
             MORRO DISTANTE
        ================================================== -->

        <div
            id="hill-far"
            class="hill hill-far"
            aria-hidden="true"
        >

            <div
                id="vegetation-far"
                class="vegetation"
            ></div>

        </div>


        <!-- =================================================
             MORRO TRASEIRO
        ================================================== -->

        <div
            id="hill-back"
            class="hill hill-back"
            aria-hidden="true"
        >

            <div
                id="vegetation-back"
                class="vegetation"
            ></div>

        </div>


        <!-- =================================================
             MORRO CENTRAL
        ================================================== -->

        <div
            id="hill-middle"
            class="hill hill-middle"
            aria-hidden="true"
        >

            <div
                id="vegetation-middle"
                class="vegetation"
            ></div>

            <!--
                As flores de memória serão colocadas
                aqui pelo JavaScript quando descobertas.
            -->

            <div
                id="memory-middle"
                class="memory-layer"
            ></div>

        </div>


        <!-- =================================================
             MORRO FRONTAL
        ================================================== -->

        <div
            id="hill-front"
            class="hill hill-front"
            aria-hidden="true"
        >

            <div
                id="vegetation-front"
                class="vegetation"
            ></div>

            <!--
                As flores de memória serão colocadas
                aqui pelo JavaScript quando descobertas.
            -->

            <div
                id="memory-front"
                class="memory-layer"
            ></div>

        </div>


        <!-- =================================================
             GIRASSOL PRINCIPAL
        ================================================== -->

        <button
            id="main-flower"
            class="main-flower"
            type="button"
            aria-label="Clique no girassol para descobrir uma lembrança"
        >

            <img
                src="imagem/girassol.png"
                alt=""
                draggable="false"
            >

        </button>


        <!-- =================================================
             JOANINHA
        ================================================== -->

        <button
            id="ladybug"
            type="button"
            aria-label="Abrir a lembrança da joaninha"
        >

            <img
                src="imagem/joaninha.png"
                alt=""
                draggable="false"
            >

        </button>


        <!-- =================================================
             INSTRUÇÃO
        ================================================== -->

        <div
            id="garden-hint"
            aria-hidden="true"
        >
            Toque no girassol 🌻
        </div>

    </main>


    <!-- =====================================================
         CAMADA DAS PÉTALAS
    ====================================================== -->

    <div
        id="petal-layer"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MODAL — MEMÓRIA
    ====================================================== -->

    <div
        id="memory-modal"
        class="modal"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="memory-caption"
    >

        <div class="modal-card">

            <button
                id="memory-close"
                class="close-button"
                type="button"
                aria-label="Fechar lembrança"
            >
                ×
            </button>


            <div class="modal-image-box">

                <img
                    id="memory-image"
                    src=""
                    alt=""
                    draggable="false"
                >

            </div>


            <p id="memory-caption"></p>

            <span id="memory-counter"></span>

        </div>

    </div>


    <!-- =====================================================
         MODAL — JOANINHA
    ====================================================== -->

    <div
        id="ladybug-modal"
        class="modal"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="ladybug-caption"
    >

        <div class="modal-card ladybug-card">

            <button
                id="ladybug-close"
                class="close-button"
                type="button"
                aria-label="Fechar lembrança da joaninha"
            >
                ×
            </button>


            <div class="ladybug-image-box">

                <img
                    src="imagem/joaninha-engracada.jpg"
                    alt="Lembrança engraçada da joaninha"
                    draggable="false"
                >

            </div>


            <p id="ladybug-caption">
                Até a joaninha deixou uma
                lembrança por aqui. 🐞😂
            </p>

        </div>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script
    src="script.js"
    defer
></script>

</body>
</html>
