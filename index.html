<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Gabi 🌻</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Música -->
    <audio id="bgMusic" loop preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Cenário -->
    <div class="sky">

        <!-- Sol -->
        <div class="sun"></div>

        <!-- Partículas -->
        <div class="light"></div>

        <!-- Nuvens -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <!-- Conteúdo -->
        <main class="content">

            <h1>Para Gabi ☀️</h1>

            <p class="subtitle">
                Algumas pessoas deixam o mundo mais bonito apenas por existirem.
            </p>

            <!-- Jardim -->
            <section id="garden">

                <!-- Terreno -->
                <div id="terrain">

                    <div class="hill hill-back"></div>

                    <div class="hill hill-middle"></div>

                    <div class="hill hill-front"></div>

                </div>

                <!-- Flores plantadas -->
                <div id="gardenField"></div>

                <!-- Efeitos -->
                <div id="effects"></div>

                <!-- Girassol principal -->
                <img
                    id="sunflower"
                    src="imagem/girassol.png"
                    alt="Girassol">

            </section>

            <p class="touch">
                Toque no girassol 🌻
            </p>

        </main>

    </div>

    <!-- Polaroid -->
    <div id="memoryModal">

        <div id="memoryCard">

            <img
                id="memoryImage"
                src=""
                alt="Lembrança">

            <p id="memoryCaption"></p>

        </div>

    </div>

    <!-- Pétalas -->
    <div id="petals"></div>

    <script src="script.js"></script>

</body>

</html>
